<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SinghsFood | Dashboard</title>

<style>
body {
    margin: 0;
    font-family: "Segoe UI", Arial, sans-serif;
    background: #f6f6f6;
}

.navbar {
    height: 60px;
    background: #ff4d4d;
    color: white;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 20px;
}

.layout {
    display: flex;
    height: calc(100vh - 60px);
}

.sidebar {
    width: 220px;
    background: #fff;
    box-shadow: 2px 0 10px rgba(0,0,0,0.05);
    padding-top: 15px;
}

.sidebar a {
    display: block;
    padding: 12px 20px;
    text-decoration: none;
    color: #333;
}

.sidebar a:hover {
    background: #ffeded;
    color: #ff4d4d;
}

.content {
    flex: 1;
    padding: 20px;
    overflow-y: auto;
}

.search-box input {
    width: 100%;
    height: 44px;
    padding: 0 12px;
    border-radius: 5px;
    border: 1px solid #ccc;
}

.main-area {
    display: flex;
    gap: 20px;
    margin-top: 20px;
}

.food-grid {
    flex: 3;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 20px;
}

.food-card {
    background: #fff;
    border-radius: 10px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    overflow: hidden;
}

.food-img {
    height: 140px;
    background: linear-gradient(135deg, #ff914d, #ff4d4d);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 48px;
}

.food-body {
    padding: 15px;
}

.food-body h4 {
    margin: 0;
}

.price {
    margin: 8px 0;
    font-weight: bold;
    color: #ff4d4d;
}

.food-body button {
    width: 100%;
    height: 36px;
    background: #ff4d4d;
    color: #fff;
    border: none;
    border-radius: 5px;
    cursor: pointer;
}

.cart {
    flex: 1;
    background: #fff;
    border-radius: 10px;
    padding: 15px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.08);
}

.cart textarea {
    width: 100%;
    height: 60px;
    margin-top: 10px;
    padding: 8px;
}

.place-order {
    width: 100%;
    margin-top: 10px;
    padding: 10px;
    background: #ff4d4d;
    color: white;
    border: none;
    border-radius: 5px;
    cursor: pointer;
}

.logout {
    display: inline-block;
    margin-top: 20px;
    padding: 10px 18px;
    background: #ff4d4d;
    color: white;
    text-decoration: none;
    border-radius: 5px;
}
</style>
</head>

<body>

<div class="navbar">
    <h2>🍔 SinghsFood</h2>
    <div>Welcome {{ request.user.username }} 👋</div>
</div>

<div class="layout">

<!-- Sidebar -->
<div class="sidebar">
    <a href="#">🍳 Breakfast</a>
    <a href="#">🍱 Lunch</a>
    <a href="#">🍽 Dinner</a>
    <a href="#">🍕 Pizza</a>
    <a href="#">🍔 Burgers</a>
    <a href="#">🍨 Ice Cream</a>
    <a href="#">🥤 Shakes</a>
    <a href="#">🍬 Sweets</a>
</div>

<!-- Content -->
<div class="content">

<div class="search-box">
    <input type="text" id="searchInput" placeholder="Search food..." onkeyup="searchFood()">
</div>

<div class="main-area">

<!-- Food Items -->
<div class="food-grid">

<div class="food-card">
    <div class="food-img">🍳</div>
    <div class="food-body">
        <h4>Masala Omelette</h4>
        <div class="price">₹89</div>
        <button onclick="addToCart('Masala Omelette',89)">Add to Cart</button>
    </div>
</div>

<div class="food-card">
    <div class="food-img">🍱</div>
    <div class="food-body">
        <h4>Veg Thali</h4>
        <div class="price">₹199</div>
        <button onclick="addToCart('Veg Thali',199)">Add to Cart</button>
    </div>
</div>

<div class="food-card">
    <div class="food-img">🍽</div>
    <div class="food-body">
        <h4>Chicken Biryani</h4>
        <div class="price">₹299</div>
        <button onclick="addToCart('Chicken Biryani',299)">Add to Cart</button>
    </div>
</div>

<div class="food-card">
    <div class="food-img">🍨</div>
    <div class="food-body">
        <h4>Vanilla Ice Cream</h4>
        <div class="price">₹99</div>
        <button onclick="addToCart('Vanilla Ice Cream',99)">Add to Cart</button>
    </div>
</div>

<div class="food-card">
    <div class="food-img">🥤</div>
    <div class="food-body">
        <h4>Chocolate Shake</h4>
        <div class="price">₹129</div>
        <button onclick="addToCart('Chocolate Shake',129)">Add to Cart</button>
    </div>
</div>

<div class="food-card">
    <div class="food-img">🍬</div>
    <div class="food-body">
        <h4>Gulab Jamun</h4>
        <div class="price">₹79</div>
        <button onclick="addToCart('Gulab Jamun',79)">Add to Cart</button>
    </div>
</div>

</div>

<!-- Cart -->
<div class="cart">
    <h3>Your Cart</h3>
    <div id="cartItems"></div>
    <div id="totalPrice"><b>Total: ₹0</b></div>

    <textarea id="address" placeholder="Enter delivery address"></textarea>
    <button class="place-order" onclick="placeOrder()">Place Order</button>
</div>

</div>

<a class="logout" href="/logout/">Logout</a>

</div>
</div>

<script>
let cart = [];

function addToCart(name, price) {
    const item = cart.find(i => i.name === name);
    if (item) item.qty++;
    else cart.push({ name, price, qty: 1 });
    renderCart();
}

function renderCart() {
    let html = "";
    let total = 0;
    cart.forEach(i => {
        total += i.price * i.qty;
        html += `<div>${i.name} × ${i.qty}</div>`;
    });
    document.getElementById("cartItems").innerHTML = html;
    document.getElementById("totalPrice").innerText = "Total: ₹" + total;
}

function placeOrder() {
    if (!cart.length) return alert("Cart is empty");
    if (!address.value.trim()) return alert("Enter address");
    alert("Order placed successfully 🎉");
    cart = [];
    renderCart();
}

function searchFood() {
    const val = searchInput.value.toLowerCase();
    document.querySelectorAll(".food-card").forEach(card => {
        card.style.display = card.innerText.toLowerCase().includes(val)
            ? "block" : "none";
    });
}
</script>

</body>
</html>
