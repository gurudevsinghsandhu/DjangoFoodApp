<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SinghsFood | Signup</title>

    <style>
        body {
            margin: 0;
            font-family: "Segoe UI", Arial, sans-serif;
            background: linear-gradient(135deg, #ff914d, #ff4d4d);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            width: 380px;
            background: #ffffff;
            padding: 30px 25px;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .logo {
            text-align: center;
            margin-bottom: 20px;
        }

        .logo h1 {
            margin: 0;
            color: #ff4d4d;
            font-size: 28px;
            font-weight: bold;
        }

        .logo p {
            margin: 5px 0 0;
            color: #777;
            font-size: 14px;
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
            color: #333;
        }

         input {
    width: 100%;
    height: 44px;
    padding: 0 12px;
    margin: 10px 0;
    border-radius: 5px;
    border: 1px solid #ccc;
    font-size: 14px;
    box-sizing: border-box;
}

input:focus {
    outline: none;
    border-color: #ff4d4d;
}

button {
    width: 100%;
    height: 44px;
    background: #ff4d4d;
    border: none;
    border-radius: 5px;
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    margin-top: 10px;
}

        button:hover {
            background: #e84343;
        }

        .message {
            margin-top: 10px;
            text-align: center;
            font-size: 14px;
            color: red;
        }

        .link {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
        }

        .link a {
            color: #ff4d4d;
            text-decoration: none;
            font-weight: bold;
        }

        .link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

<div class="container">

    <div class="logo">
        <h1>🍕 SinghsFood</h1>
        <p>Create your account</p>
    </div>

    <h2>Signup</h2>

    <form id="signupForm">
        {% csrf_token %}
        <input type="text" id="username" placeholder="Username" required>
        <input type="email" id="email" placeholder="Email" required>
        <input type="password" id="password" placeholder="Password" required>

        <button type="submit">Create Account</button>
    </form>

    <p id="message" class="message"></p>

    <div class="link">
        Already have an account?
        <a href="/">Login here</a>
    </div>

</div>

<script>
document.getElementById("signupForm").addEventListener("submit", function(e) {
    e.preventDefault();

    fetch("/api/signup/", {
        method: "POST",
        headers: {
            "Content-Type": "application/json",
            "X-CSRFToken": "{{ csrf_token }}"
        },
        body: JSON.stringify({
            username: document.getElementById("username").value,
            email: document.getElementById("email").value,
            password: document.getElementById("password").value
        })
    })
    .then(res => res.json())
    .then(data => {
        if (data.message) {
            window.location.href = "/";
        } else {
            document.getElementById("message").innerText = "Signup failed";
        }
    })
    .catch(() => {
        document.getElementById("message").innerText = "Server error";
    });
});
</script>

</body>
</html>
