<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SinghsFood | Login</title>

    <style>
        body {
            margin: 0;
            font-family: "Segoe UI", Arial, sans-serif;
            background: linear-gradient(135deg, #ff914d, #ff4d4d);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            width: 360px;
            background: #ffffff;
            padding: 30px 25px;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .logo {
            text-align: center;
            margin-bottom: 20px;
        }

        .logo h1 {
            margin: 0;
            color: #ff4d4d;
            font-size: 28px;
            font-weight: bold;
        }

        .logo p {
            margin: 5px 0 0;
            color: #777;
            font-size: 14px;
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
            color: #333;
        }

        input {
    width: 100%;
    height: 44px;
    padding: 0 12px;
    margin: 10px 0;
    border-radius: 5px;
    border: 1px solid #ccc;
    font-size: 14px;
    box-sizing: border-box;
}

input:focus {
    outline: none;
    border-color: #ff4d4d;
}

button {
    width: 100%;
    height: 44px;
    background: #ff4d4d;
    border: none;
    border-radius: 5px;
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    margin-top: 10px;
}

        button:hover {
            background: #e84343;
        }

        .error {
            color: red;
            margin-top: 10px;
            text-align: center;
            font-size: 14px;
        }

        .link {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
        }

        .link a {
            color: #ff4d4d;
            text-decoration: none;
            font-weight: bold;
        }

        .link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

<div class="container">

    <div class="logo">
        <h1>🍔 SinghsFood</h1>
        <p>Fresh food, fast delivery</p>
    </div>

    <h2>Login</h2>

    <form id="loginForm">
        {% csrf_token %}
        <input type="text" id="username" placeholder="Username" required>
        <input type="password" id="password" placeholder="Password" required>

        <button type="submit">Login</button>
    </form>

    <p id="message" class="error"></p>

    <div class="link">
        Don’t have an account?
        <a href="/signup/">Signup here</a>
    </div>

</div>

<script>
(function () {
    const form = document.getElementById("loginForm");
    const message = document.getElementById("message");

    form.addEventListener("submit", function (e) {
        e.preventDefault();
        message.innerText = "";

        fetch("/api/login/", {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "X-CSRFToken": "{{ csrf_token }}"
            },
            body: JSON.stringify({
                username: document.getElementById("username").value.trim(),
                password: document.getElementById("password").value
            })
        })
        .then(response => response.json())
        .then(data => {
            if (data.message) {
                window.location.href = "/dashboard/";
            } else {
                message.innerText = data.error || "Login failed";
            }
        })
        .catch(() => {
            message.innerText = "Server error. Try again.";
        });
    });
})();
</script>

</body>
</html>
